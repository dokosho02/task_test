name: Artifact Demo

on:
  workflow_dispatch:

jobs:
  artifact-job:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 准备目录
      - name: Prepare directory
        run: mkdir -p data
      
      - name: Check artifact existence
        id: check-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 调用 GitHub API 获取所有 Artifacts
          artifact=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "my-data")')
          
          # 判断是否存在并输出结果
          if [ -n "$artifact" ]; then
            echo "✅ Artifact 'my-data' exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Artifact 'my-data' does not exist."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      # 4. 下载Artifact（仅在存在时执行）
      - name: Download artifact
        if: steps.check-artifact.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: my-data
          path: data/
      
      # 5. 初始化或验证数据
      - name: Verify data
        run: |
          if [ -f "data/record.json" ]; then
            echo "✅ 成功加载Artifact"
            echo "当前内容: $(cat data/record.json)"
          else
            echo "🆕 初始化新文件"
            mkdir -p data
            echo '{"count": 0}' > data/record.json
          fi
      
      # 6. 更新数据
      - name: Update data
        run: |
          count=$(jq '.count' data/record.json)
          new_count=$((count + 1))
          echo "更新计数: $count → $new_count"
          jq ".count = $new_count" data/record.json > tmp.json && mv tmp.json data/record.json
      
      # 7. 上传Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-data
          path: data/record.json
          retention-days: 7
          overwrite: true
      
      # 8. 最终验证
      - name: Final check
        run: |
          echo "=== 最终文件内容 ==="
          cat data/record.json
