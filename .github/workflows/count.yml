name: Artifact Demo

on:
  workflow_dispatch:

jobs:
  artifact-job:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 准备目录
      - name: Prepare directory
        run: mkdir -p data
        
      # 3. 检查Artifact是否存在（跨运行检查）
      - name: Check artifact existence
        id: check-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 使用GH CLI查询最新的有效Artifact（排除当前运行的）
          artifact=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '[.artifacts[] | select(.name == "my-data" and .expired == false and .workflow_run.id != ${{ github.run_id }})][0]')
          
          if [ -n "$artifact" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Artifact 'my-data' exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Artifact 'my-data' does not exist."
          fi

      # 4. 下载Artifact（跨运行下载）
      - name: Download artifact from previous run
        if: steps.check-artifact.outputs.exists == 'true'
        uses: dawidd6/action-download-artifact@v3
        with:
          name: my-data
          path: data/
          workflow: .github/workflows/count.yml  # 指定工作流文件路径
          workflow_conclusion: success                   # 仅下载成功运行的Artifact
          token: ${{ github.token }}

      # 5. 初始化或验证数据
      - name: Verify data
        run: |
          if [ -f "data/record.json" ]; then
            echo "✅ 成功加载Artifact"
            echo "当前内容: $(cat data/record.json)"
          else
            echo "🆕 初始化新文件"
            mkdir -p data
            echo '{"count": 0}' > data/record.json
          fi
      
      # 6. 更新数据
      - name: Update data
        run: |
          count=$(jq '.count' data/record.json)
          new_count=$((count + 1))
          echo "更新计数: $count → $new_count"
          jq ".count = $new_count" data/record.json > tmp.json && mv tmp.json data/record.json
      
      # 7. 上传Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-data
          path: data/record.json
          retention-days: 7
          overwrite: true
      
      # 8. 最终验证
      - name: Final check
        run: |
          echo "=== 最终文件内容 ==="
          cat data/record.json
